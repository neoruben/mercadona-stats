name: Compilar APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Tests y APK de prueba
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar el Android SDK
        uses: android-actions/setup-android@v3

      # El repositorio no incluye el wrapper de Gradle: se usa esta versión.
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.2"

      - name: Ejecutar los tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compilar la APK de depuración
        run: gradle :app:assembleDebug --no-daemon

      - name: Guardar la APK
        uses: actions/upload-artifact@v4
        with:
          name: MercaStats-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
