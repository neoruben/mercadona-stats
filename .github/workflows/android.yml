name: Compilar APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Tests y APK de prueba
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      # Gradle se ejecuta con Java 25 (gradle/gradle-daemon-jvm.properties), como el JBR de Android Studio.
      - name: Instalar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Preparar el Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # La versión de Gradle la fija el wrapper (gradle/wrapper/gradle-wrapper.properties).
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar los tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Compilar la APK de depuración
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Guardar la APK
        uses: actions/upload-artifact@v4
        with:
          name: MercaStats-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
